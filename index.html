<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineWeb</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f1f1f1;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      width: min(560px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid #222;
      border-radius: 16px;
      background: #0d0d0d;
      box-shadow: 0 14px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: #aaa; line-height: 1.5; }
    form { display: flex; gap: 10px; margin-top: 20px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      outline: none;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }
    code { color: #d6d6d6; }
  </style>
</head>
<body>
  <main>
    <h1>CineWeb</h1>
    <p>Enter a URL to open it through the included proxy runtime.</p>
    <form action="/embed.html" method="get">
      <input name="url" type="url" inputmode="url" placeholder="https://example.com" required>
      <button type="submit">Open</button>
    </form>
    <p style="font-size:.85rem;margin-bottom:0">
      Direct embed endpoint: <code>/embed.html?url=https://example.com</code>
    </p>
  </main>
</body>
</html>
